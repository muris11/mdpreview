<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MDPreview Center — a modern Markdown editor with live preview, Mermaid diagrams, KaTeX math, syntax highlighting and shareable links."
    />
    <meta name="theme-color" content="#0b0f17" />
    <meta property="og:title" content="MDPreview Center" />
    <meta
      property="og:description"
      content="Write Markdown, preview it live, and share it with a single link."
    />
    <meta property="og:type" content="website" />
    <title>MDPreview Center — Markdown editor with live preview</title>
    <script>
      // Apply the persisted theme before paint to avoid a flash of the wrong theme.
      try {
        var raw = localStorage.getItem('mdpreview:theme')
        var stored = null
        if (raw) {
          try {
            stored = JSON.parse(raw)
          } catch (e) {
            stored = raw
          }
        }
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = stored ? stored === 'dark' : prefersDark
        document.documentElement.classList.toggle('dark', isDark)
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
